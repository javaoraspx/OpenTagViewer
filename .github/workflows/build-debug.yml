name: Generate APK (Debug)

permissions:
  contents: write
env:
  # The name of the main module repository
  main_project_module: app
  # The name of the App
  app_name: OpenTagViewer

on:
  push:
    branches: [ "main" ]
    paths:
      # only run when Android-related stuff actually changed!
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle.bat"
      - "local.defaults.properties"
      - "settings.gradle.kts"
      # The build shells out to exactly these two, so a change to either can break it
      # without touching anything else in this list. The rest of scripts/ cannot, and
      # listing the whole directory booted an emulator for every docstring in it -
      # those are checked by static-checks.yml instead.
      - "scripts/build_unicorn_stub_wheel.py"
      - "scripts/fetch_contributors.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle.bat"
      - "local.defaults.properties"
      - "settings.gradle.kts"
      # The build shells out to exactly these two, so a change to either can break it
      # without touching anything else in this list. The rest of scripts/ cannot, and
      # listing the whole directory booted an emulator for every docstring in it -
      # those are checked by static-checks.yml instead.
      - "scripts/build_unicorn_stub_wheel.py"
      - "scripts/fetch_contributors.py"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    environment: 'Android Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inject secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      # **So every debug APK this repository publishes is signed by the same key.**
      #
      # A runner has no ~/.android/debug.keystore, so AGP generates one per run. That makes each
      # debug APK unupgradeable over the last (INSTALL_FAILED_UPDATE_INCOMPATIBLE, and with
      # allowBackup false an uninstall destroys the tester's imported beacons), and it makes the
      # Maps SHA-1 restriction impossible to satisfy, which is why maps rendered blank here and
      # not locally.
      #
      # Absent secret is not fatal: a fork without it falls back to the generated key and still
      # builds, which is the behaviour a fork wants.
      #
      # Passed through `env` rather than interpolated into the script: the `secrets` context is
      # not available in a step-level `if` at all, and a `${{ }}` inside a run block puts the
      # value on the command line, where a shell trace or an injected newline can expose it.
      - name: Write the shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret; AGP will generate a debug key for this run."
            echo "APKs from this run cannot be installed over ones from another."
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug-keystore.jks
          echo "Debug keystore written, $(wc -c < app/debug-keystore.jks) bytes"

      # No stub wheel to validate any more: it is generated from app/stubs/unicorn/ by
      # generateUnicornStubWheel during the build, rather than being checked in.

      # Run Tests Build
      - name: Run gradle tests
        run: ./gradlew test

      # Covers app/src/main/python (the module Chaquopy packages into the APK).
      # Runs on plain CPython - it imports no Android or Java types.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Chaquopy bridge test dependencies
        run: python -m pip install -r app/src/test/python/requirements.txt

      - name: Run Chaquopy bridge tests
        run: python -m pytest app/src/test/python -v

      # Create APK Debug
      - name: Build Debug APK - ${{ env.main_project_module }} module
        run: ./gradlew testDebugUnitTest assembleDebug

      # Publish the freshly built phone-only APK to a GitHub Release so testers can download it
      # straight from the Releases page (no artifact login / slow blob redirect needed). The
      # version comes from the single source of truth in build.gradle.kts, never hardcoded here.
      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(python3 scripts/release_version.py --kind android --print)"
          TAG="debug-v${APP_VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Publishing $APK to release $TAG"
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" "$APK" --clobber \
            || gh release create "$TAG" "$APK" \
                 --title "OpenTagViewer ${APP_VERSION} (debug, arm64)" \
                 --notes "Debug APK for real devices (arm64-v8a only). Rebuilt from the latest main." \
                 --prerelease

      # Upload Artifact Build
      # Noted For Output [main_project_module]/build/outputs/apk/debug/
      - name: Upload APK Debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) debug generated
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      # Room writes these during the build, and rule 1 requires the new one to be committed with
      # the migration that produced it. They are generated, so somebody without an Android
      # toolchain cannot produce one at all - and the version bump is exactly the change most
      # likely to be written by somebody who cannot build. Published so it can be taken from here
      # and committed. Always, so a failed run that still got far enough is not a dead end.
      - name: Upload the exported Room schemas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: ${{ env.main_project_module }}/schemas/
          if-no-files-found: warn

name: Generate APK (Release, signed)

permissions:
  contents: write
env:
  # The name of the main module repository
  main_project_module: app
  # The name of the App
  app_name: OpenTagViewer

on:
  push:
    branches: [ "main" ]
    paths:
      # only run when Android-related stuff actually changed!
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle.bat"
      - "local.defaults.properties"
      - "settings.gradle.kts"
      # The build shells out to exactly these two, so a change to either can break it
      # without touching anything else in this list. The rest of scripts/ cannot, and
      # listing the whole directory booted an emulator for every docstring in it -
      # those are checked by static-checks.yml instead.
      - "scripts/build_unicorn_stub_wheel.py"
      - "scripts/fetch_contributors.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle.bat"
      - "local.defaults.properties"
      - "settings.gradle.kts"
      # The build shells out to exactly these two, so a change to either can break it
      # without touching anything else in this list. The rest of scripts/ cannot, and
      # listing the whole directory booted an emulator for every docstring in it -
      # those are checked by static-checks.yml instead.
      - "scripts/build_unicorn_stub_wheel.py"
      - "scripts/fetch_contributors.py"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    environment: 'Android Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inject secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      # **A real release build, signed by one fixed key that lives in the repository.**
      #
      # This used to assemble a debug APK signed by a per-run generated key: every build was
      # unupgradeable over the last and the app called itself ".debug". It now builds the release
      # variant with one fixed keystore, so successive builds install over one another and the
      # app has its real package name.
      #
      # The keystore (app/ci-release-keystore.jks) is committed on purpose: this is a personal
      # fork, and a committed key means any run - with no secret to configure - produces an APK
      # that upgrades the previous one. It guards nothing worth guarding here, but it is not a
      # key anyone should publish an app on a store with. The password is the same well-known
      # constant build.gradle.kts already falls back to for a local build.
      - name: Check the release keystore is present
        run: |
          test -f app/ci-release-keystore.jks \
            || { echo "::error::app/ci-release-keystore.jks is missing"; exit 1; }
          echo "Release keystore present, $(wc -c < app/ci-release-keystore.jks) bytes"

      # No stub wheel to validate any more: it is generated from app/stubs/unicorn/ by
      # generateUnicornStubWheel during the build, rather than being checked in.

      # Run Tests Build
      - name: Run gradle tests
        run: ./gradlew test

      # Covers app/src/main/python (the module Chaquopy packages into the APK).
      # Runs on plain CPython - it imports no Android or Java types.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Chaquopy bridge test dependencies
        run: python -m pip install -r app/src/test/python/requirements.txt

      - name: Run Chaquopy bridge tests
        run: python -m pytest app/src/test/python -v

      # Create the signed Release APK. The signing password environment variables the build
      # reads (KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) are exported for this step only.
      - name: Build Release APK - ${{ env.main_project_module }} module
        env:
          KEYSTORE_FILE: ci-release-keystore.jks
          KEYSTORE_PASSWORD: opentagviewer-ci
          KEY_ALIAS: upload
          KEY_PASSWORD: opentagviewer-ci
        run: ./gradlew testReleaseUnitTest assembleRelease

      # Publish the signed APK to GitHub Releases so it can be downloaded and installed straight
      # from the Releases page. The version comes from the single source of truth in
      # build.gradle.kts (scripts/release_version.py), never hardcoded here.
      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 scripts/release_version.py --kind android --print)"
          TAG="v${APP_VERSION}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Release APK missing at $APK"; exit 1; }
          echo "Publishing $APK as release $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "OpenTagViewer ${APP_VERSION}" \
              --notes "Signed release APK ${APP_VERSION} (arm64-v8a, real devices only). Built from main." \
              --latest
          fi

      # Upload Artifact Build
      - name: Upload APK Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) release generated
          path: ${{ env.main_project_module }}/build/outputs/apk/release/

      # Room writes these during the build, and rule 1 requires the new one to be committed with
      # the migration that produced it. They are generated, so somebody without an Android
      # toolchain cannot produce one at all - and the version bump is exactly the change most
      # likely to be written by somebody who cannot build. Published so it can be taken from here
      # and committed. Always, so a failed run that still got far enough is not a dead end.
      - name: Upload the exported Room schemas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: ${{ env.main_project_module }}/schemas/
          if-no-files-found: warn
